[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spin_gnn"
version = "0.1.0"
description = "Self-supervised GNN next-token prediction on a disordered kinetic Ising spin model"
requires-python = ">=3.10"
dependencies = ["numpy", "numba"]

[tool.setuptools]
packages = ["spin_gnn"]
